<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Universal Review Prompt — phân tích phản biện dự án bằng AI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#111c33"/>
      <stop offset="100%" stop-color="#1e2a47"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="340" rx="24" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="4" rx="2" fill="url(#accent)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif">
    <text x="72" y="118" fill="#f8fafc" font-size="54" font-weight="700" letter-spacing="-1">Universal Review Prompt</text>
    <text x="72" y="164" fill="#94a3b8" font-size="24">Phân tích phản biện dự án phần mềm bằng AI — có bằng chứng, có phản biện ngược.</text>

    <g transform="translate(72, 210)">
      <rect width="252" height="52" rx="26" fill="#1e293b" stroke="#334155"/>
      <text x="28" y="33" fill="#e2e8f0" font-size="19">Mode A · Chỉ tài liệu</text>

      <rect x="272" width="278" height="52" rx="26" fill="#1e293b" stroke="#334155"/>
      <text x="300" y="33" fill="#e2e8f0" font-size="19">Mode B · Code + tài liệu</text>

      <rect x="570" width="228" height="52" rx="26" fill="#1e293b" stroke="#334155"/>
      <text x="598" y="33" fill="#e2e8f0" font-size="19">Mode C · Chỉ code</text>
    </g>

    <text x="72" y="300" fill="#64748b" font-size="17">Tự nhận diện artifact thật trong repo · Không bịa · Xuất báo cáo Markdown có cấu trúc</text>
  </g>

  <g opacity="0.5">
    <circle cx="1080" cy="96" r="86" fill="none" stroke="#334155" stroke-width="1.5"/>
    <circle cx="1080" cy="96" r="58" fill="none" stroke="#3b4a68" stroke-width="1.5"/>
    <circle cx="1080" cy="96" r="30" fill="none" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="1080" cy="96" r="7" fill="#a78bfa"/>
  </g>
</svg>
